name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # CI JOBS - Run on every push/PR
  # ═══════════════════════════════════════════════════════════════════════════

  ci:
    name: CI / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: true
      matrix:
        task: [build, test, quality, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────────────────
      # Build Task
      # ─────────────────────────────────────────────────────────────────────────
      - name: Build all packages
        if: matrix.task == 'build'
        run: bun run build

      - name: Verify build artifacts
        if: matrix.task == 'build'
        run: |
          echo "Verifying build artifacts..."
          test -f packages/core/dist/index.js || (echo "❌ core missing" && exit 1)
          test -f packages/cli/dist/cli.js || (echo "❌ cli missing" && exit 1)
          test -f packages/mcp-server/dist/mcp-server.js || (echo "❌ mcp-server missing" && exit 1)
          test -f packages/vscode-extension/dist/extension.js || (echo "❌ vscode-extension missing" && exit 1)
          echo "✅ All build artifacts verified"

      - name: Upload build artifacts
        if: matrix.task == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: packages/*/dist
          retention-days: 1

      # ─────────────────────────────────────────────────────────────────────────
      # Test Task
      # ─────────────────────────────────────────────────────────────────────────
      - name: Build for tests
        if: matrix.task == 'test'
        run: bun run build

      - name: Run Core & Extension tests (with coverage)
        if: matrix.task == 'test'
        run: bun test packages/core packages/vscode-extension packages/shared packages/mcp-server scripts/release-workflow.test.ts --reporter=junit --reporter-outfile=reports/junit.xml --coverage --coverage-reporter=lcov --coverage-dir=reports/coverage

      # CLI tests separated for isolation
      - name: Run CLI tests (isolated)
        if: matrix.task == 'test'
        run: bun test packages/cli

      - name: Publish Test Results
        if: matrix.task == 'test' && (success() || failure())
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "reports/junit.xml"

      - name: Upload coverage artifact
        if: matrix.task == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: reports/coverage
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.task == 'test'
        uses: codecov/codecov-action@v7
        with:
          files: ./reports/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────────
      # Quality Task (Biome + TypeScript)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Run Biome checks
        if: matrix.task == 'quality'
        run: bun run check:ci

      - name: TypeScript type check
        if: matrix.task == 'quality'
        run: bun run typecheck

      # ─────────────────────────────────────────────────────────────────────────
      # Security Task (dependency advisories)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Audit dependencies
        if: matrix.task == 'security'
        run: bun audit --audit-level=low

      - name: Review dependency changes
        if: matrix.task == 'security' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5

  # ═══════════════════════════════════════════════════════════════════════════
  # RELEASE JOB - Only on push to main (after CI passes)
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # npm Trusted Publishing uses OIDC instead of a long-lived NPM_TOKEN.
      # npm CLI 11.5.1+ and Node.js 22.14+ are required for this flow.
      - name: Setup Node.js (for npm Trusted Publishing)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Use custom publish script that properly resolves workspace: protocol
          # See: https://github.com/oven-sh/bun/issues/24687
          publish: bun run scripts/publish.ts
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────────
      # VS Code Extension Publishing (version-gated against Marketplace)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publish VS Code Extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          EXTENSION_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          MARKETPLACE_HAS_VERSION=$(curl -fsSL -X POST \
            -H 'Content-Type: application/json' \
            --data '{"filters":[{"criteria":[{"filterType":7,"value":"EcuaByte.cortex-vscode"}]}],"flags":914}' \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery?api-version=7.2-preview.1' \
            | jq -r --arg version "$EXTENSION_VERSION" \
              'any(.results[0].extensions[0].versions[]?.version; . == $version)')

          if [[ "$MARKETPLACE_HAS_VERSION" != "true" ]]; then
            echo "📦 Publishing VS Code Extension..."
            cd packages/vscode-extension
            set +e
            PUBLISH_OUTPUT=$(bunx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT" 2>&1)
            PUBLISH_STATUS=$?
            set -e
            echo "$PUBLISH_OUTPUT"

            if [[ "$PUBLISH_STATUS" -eq 0 ]]; then
              echo "✅ VS Code Extension published successfully"
            elif [[ "$PUBLISH_OUTPUT" == *"already exists"* ]]; then
              echo "ℹ️ VS Code Marketplace already has $EXTENSION_VERSION, continuing."
            else
              echo "❌ VS Code Extension publishing failed."
              exit "$PUBLISH_STATUS"
            fi
          else
            echo "ℹ️ VS Code Marketplace already has $EXTENSION_VERSION, skipping."
          fi

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          EXTENSION_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          OVSX_VERSION=$(curl -fsSL \
            'https://open-vsx.org/api/EcuaByte/cortex-vscode' \
            | jq -r '.version // "0.0.0"' || echo "0.0.0")

          if [[ "$EXTENSION_VERSION" != "$OVSX_VERSION" ]]; then
            echo "📦 Publishing to Open VSX..."
            cd packages/vscode-extension
            set +e
            PUBLISH_OUTPUT=$(bunx ovsx publish --no-dependencies -p "$OVSX_PAT" 2>&1)
            PUBLISH_STATUS=$?
            set -e
            echo "$PUBLISH_OUTPUT"

            if [[ "$PUBLISH_STATUS" -eq 0 ]]; then
              echo "✅ Published to Open VSX successfully"
            elif [[ "$PUBLISH_OUTPUT" == *"already published"* || "$PUBLISH_OUTPUT" == *"already exists"* ]]; then
              echo "ℹ️ Open VSX already recorded $EXTENSION_VERSION, continuing."
            else
              echo "❌ Open VSX publishing failed."
              exit "$PUBLISH_STATUS"
            fi
          else
             echo "ℹ️ Open VSX already has $EXTENSION_VERSION, skipping."
          fi

      # GitHub Releases are a separate distribution channel from Marketplace
      # and Open VSX. Keep one immutable release per extension version and
      # attach the VSIX users can install manually.
      - name: Create GitHub Release for VS Code Extension
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          EXTENSION_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          RELEASE_TAG="cortex-vscode@${EXTENSION_VERSION}"
          VSIX_PATH="$RUNNER_TEMP/cortex-vscode-${EXTENSION_VERSION}.vsix"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ℹ️ GitHub Release $RELEASE_TAG already exists, skipping."
            exit 0
          fi

          cd packages/vscode-extension
          bunx @vscode/vsce package --no-dependencies --out "$VSIX_PATH"
          test -f "$VSIX_PATH"

          gh release create "$RELEASE_TAG" "$VSIX_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cortex VS Code ${EXTENSION_VERSION}" \
            --generate-notes \
            --latest

  # ═══════════════════════════════════════════════════════════════════════════
  # CODEQL SECURITY ANALYSIS - Main pushes and pull requests
  # ═══════════════════════════════════════════════════════════════════════════

  codeql:
    name: CodeQL Security Analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ═══════════════════════════════════════════════════════════════════════════
  # PARENT SYNC - Notify cortex-cloud to update submodule
  # ═══════════════════════════════════════════════════════════════════════════

  sync-parent:
    name: Sync Parent Repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Parent Sync
        if: ${{ vars.PARENT_REPOSITORY != '' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.SUBMODULE_PAT }}
          repository: ${{ vars.PARENT_REPOSITORY }}
          event-type: submodule-update
          client-payload: '{"submodule": "cortex"}'
