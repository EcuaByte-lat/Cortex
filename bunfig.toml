# Bun configuration for Cortex monorepo

[install]
# Use hoisted for monorepo compatibility
linker = "hoisted"
# Symlinks preserve package entrypoints on Windows; hardlink installs can omit
# files exposed through package-level symlinks (notably TypeScript and scheduler).
backend = "symlink"
# Auto-install peer dependencies
auto = "fallback"

[run]
# Use Bun runtime by default
bun = true
# Suppress unnecessary output
silent = false

[test]
# Test configuration
coverage = true
